<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff3ef;--card:#fff;--ink:#3a1f2b;--mute:#8a6b74;--line:#f7d8d1;--acc:#e0457b;--acc2:#fff;--bad:#c9303a;--ok:#1f8a63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#37202b;--ink:#ffeee9;--mute:#d3a9b3;--line:#503040;--acc:#ff7aa8;--acc2:#2a1620;--bad:#ff8a84;--ok:#7fe0b4}}
:root[data-theme="dark"]{--bg:#2a1620;--card:#37202b;--ink:#ffeee9;--mute:#d3a9b3;--line:#503040;--acc:#ff7aa8;--acc2:#2a1620;--bad:#ff8a84;--ok:#7fe0b4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.brand{margin:6px 0 16px}.logo{background:linear-gradient(135deg,#e0457b,#ff7a59);border-radius:16px;padding:16px 12px}.logo img{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}.brand h1{font:italic 500 36px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;color:var(--acc)}.brand p{margin:4px 0 0;color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--acc),#ff7a59);color:var(--acc2);border-color:transparent;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font:800 24px/1.2 "Nunito",system-ui,sans-serif;color:var(--acc)}.stat span{color:var(--mute);font-size:13px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .w{grid-column:1/-1}
label{font-size:13px;color:var(--mute);display:block}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button.p{background:linear-gradient(135deg,var(--acc),#ff7a59);color:var(--acc2);border:0;font-weight:700;border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row small{color:var(--mute);display:block}
.x{background:none;border:0;color:var(--bad);font-size:20px;cursor:pointer;padding:4px 8px}
.r{text-align:right}.g{color:var(--ok)}.b{color:var(--bad)}
a{color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--acc),#ff7a59);color:var(--acc2);border-color:transparent}
.det{padding:10px 12px;margin:0 0 6px;background:var(--bg);border-radius:10px;font-size:14px}.det .l{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.empty{color:var(--mute);text-align:center;padding:12px 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

function exportXls(){
 if(!window.XLSX){xlNote("No se pudo cargar el exportador de Excel",1);return}
 if(!dl){xlNote("La descarga no está disponible en este momento",1);return}
 var cob=RL.filter(function(v){return v.tipo!="pago"}),pag=RL.filter(function(v){return v.tipo=="pago"});
 var f2=function(v){var d=new Date(v.d);return [d.toLocaleDateString("es"),d.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})]};
 var r2=function(x){return Math.round(x*100)/100};
 var rc=cob.map(function(v){var t=f2(v),sub=0,cs=(v.lines||[]).map(function(l){sub+=l.price*l.q;return l.name+" x"+l.q}).join("; ");if(!(v.lines||[]).length)sub=v.total;
  return {"Fecha":t[0],"Hora":t[1],"Cliente":v.client||"Cliente general","Conceptos":cs,"Forma de pago":v.method,"Subtotal":r2(sub),"Descuento":r2(Math.max(0,sub-v.total)),"Total":r2(v.total),"Ganancia":r2(v.total-v.cost)}});
 var rp=pag.map(function(v){var t=f2(v);return {"Fecha":t[0],"Hora":t[1],"Proveedor":v.client||"Otro","Concepto":v.concepto||"","Forma de pago":v.method,"Importe":r2(v.total)}});
 var ms=["Efectivo","Tarjeta","Bizum"];RL.forEach(function(v){if(ms.indexOf(v.method)<0)ms.push(v.method)});
 var tc=0,tp=0,rs=ms.map(function(m){var a=cob.filter(function(v){return v.method==m}),b=pag.filter(function(v){return v.method==m}),x=0,y=0;a.forEach(function(v){x+=v.total});b.forEach(function(v){y+=v.total});tc+=x;tp+=y;
  return {"Forma de pago":m,"Nº cobros":a.length,"Total cobrado":r2(x),"Total pagos":r2(y)}});
 rs.push({"Forma de pago":"TOTAL","Nº cobros":cob.length,"Total cobrado":r2(tc),"Total pagos":r2(tp)});
 var fm=function(ws,cols){var rg=XLSX.utils.decode_range(ws["!ref"]);for(var r=1;r<=rg.e.r;r++)cols.forEach(function(c){var a=XLSX.utils.encode_cell({r:r,c:c});if(ws[a])ws[a].z='#,##0.00 "€"'})};
 var mk=function(rows,w,cols,hd){var ws=XLSX.utils.json_to_sheet(rows.length?rows:[hd]);ws["!cols"]=w.map(function(x){return{wch:x}});fm(ws,cols);return ws};
 var wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,mk(rs,[16,11,15,13],[2,3],{}),"Resumen");
 XLSX.utils.book_append_sheet(wb,mk(rc,[11,7,24,48,15,11,11,11,11],[5,6,7,8],{"Fecha":"","Hora":"","Cliente":"","Conceptos":"","Forma de pago":"","Subtotal":"","Descuento":"","Total":"","Ganancia":""}),"Cobros");
 XLSX.utils.book_append_sheet(wb,mk(rp,[11,7,26,32,15,11],[5],{"Fecha":"","Hora":"","Proveedor":"","Concepto":"","Forma de pago":"","Importe":""}),"Pagos");
 var data;try{data=XLSX.write(wb,{bookType:"xlsx",type:"array"})}catch(e){xlNote("No se pudo crear el archivo de Excel",1);return}
 var nm="cobros-y-pagos-guacimara-"+per+"-"+new Date().toISOString().slice(0,10)+".xlsx";
 dl.save({filename:nm,data:data}).then(function(){xlNote("Excel guardado",0)}).catch(function(e){xlNote(e&&e.code=="declined"?"Descarga cancelada":"No se pudo descargar el Excel",1)})}

 if(p[0]=="productos"){var u=q;cart.forEach(function(l){if(l.k==p[0]&&l.n==+p[1])u+=l.q});if(u>i.stock){err("Solo quedan "+i.stock+" en stock de "+i.name);return}}
 cart.push({k:p[0],n:+p[1],q:q});render()}
function cobrar(){if(!cart.length){err("Agrega algo para cobrar");return}
 var st=sub(),tot=st-st*(+cj.disc||0)/100;
 if(cj.method=="Efectivo"&&cj.rec!==""&&+cj.rec<tot){err("El efectivo recibido es menor al total");return}
 var cost=0,lines=[];cart.forEach(function(l){var i=itm(l);cost+=i.cost*l.q;lines.push({name:i.name,q:l.q,price:i.price});if(l.k=="productos")i.stock-=l.q});
 var cg=cj.method=="Efectivo"&&cj.rec!==""?(+cj.rec-tot):0;
 D.ventas.push({d:new Date().toISOString(),client:cj.client,lines:lines,total:tot,cost:cost,method:cj.method,rec:cj.rec,cg:cg});save(["ventas","productos"],mkey(D.ventas[D.ventas.length-1].d));
 msg="Cobro registrado: "+$(tot)+(cg>0?" · Cambio "+$(cg):"");cart=[];cj={client:"",disc:0,method:"Efectivo",rec:""};render()}
function editForm(k,i,n){var c=!!CT[k],M=META[k]||{};var v=function(x){return esc(x===undefined?"":x)};
 var h='<form onsubmit="saveEd(event,\''+k+'\','+n+')" style="padding:10px 0;border-top:1px solid var(--line)"><div class="w"><label>Nombre</label><input name="name" value="'+v(i.name)+'" required></div>';
 if(c)h+='<div><label>Teléfono</label><input name="tel" type="tel" value="'+v(i.tel)+'"></div><div><label>Correo</label><input name="mail" type="email" value="'+v(i.mail)+'"></div><div class="w"><label>'+CT[k].x+'</label><input name="x" value="'+v(i.x)+'"></div>';
 else{h+='<div><label>'+M.costL+'</label><input name="cost" type="number" step="0.01" min="0" value="'+v(i.cost)+'" required></div><div><label>'+M.priceL+'</label><input name="price" type="number" step="0.01" min="0" value="'+v(i.price)+'" required></div>';
  if(M.stock)h+='<div class="w"><label>Cantidad en stock</label><input name="stock" type="number" min="0" value="'+v(i.stock)+'"></div>'}
 return h+'<button class="p">Guardar</button><button type="button" class="p" style="background:var(--line);color:var(--ink)" onclick="ed=null;render()">Cancelar</button></form>'}
function saveEd(e,k,n){e.preventDefault();var f=e.target,o=D[k][n];o.name=f.name.value.trim();
 if(CT[k]){o.tel=f.tel.value.trim();o.mail=f.mail.value.trim();o.x=f.x.value.trim()}
 else{o.cost=+f.cost.value;o.price=+f.price.value;if(META[k].stock)o.stock=+f.stock.value||0}
 ed=null;save([k]);render()}
function add(e,k){e.preventDefault();var f=e.target,o={name:f.name.value.trim(),cost:+f.cost.value,price:+f.price.value};
 if(META[k].stock)o.stock=+f.stock.value||0;D[k].push(o);save([k]);render()}
var ed=null,pend=null,openV=null,per="hoy",RL=[],xlMsg="",xlBad=0;
var imp=null,iMsg="",iBad=0;
var FLD={clientes:[["name","Nombre"],["tel","Teléfono"],["mail","Correo"],["x","Notas"]],proveedores:[["name","Nombre"],["tel","Teléfono"],["mail","Correo"],["x","Qué suministra"]],servicios:[["name","Nombre"],["price","Precio"],["cost","Costo"]],productos:[["name","Nombre"],["price","Precio de venta"],["cost","Costo"],["stock","Stock"]]};
var PATN={clientes:/^(nombre|cliente|name)/,proveedores:/^(nombre|proveedor|name)/,servicios:/^(nombre|servicio|concepto|descripcion|name)/,productos:/^(nombre|producto|articulo|name)/};
var PAT={tel:/tel|movil|phone|whats/,mail:/mail|correo/,x:/nota|observ|suministra|comentario/,price:/precio|pvp|importe|venta|tarifa|price/,cost:/cost|coste|compra/,stock:/stock|cantidad|existencia|unidades/};
var PRIM={clientes:/^cliente/,proveedores:/^proveedor/,servicios:/^servicio/,productos:/^producto/};
function pat(f){return f=="name"?PATN[imp.k]:PAT[f]}
function nrm(t){return String(t==null?"":t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function nonEmpty(c,from){var n=0;imp.rows.slice(from,from+300).forEach(function(r){if(String(r[c]==null?"":r[c]).trim()!=="")n++});return n}
function loadSheet(name){imp.sheet=name;imp.rows=XLSX.utils.sheet_to_json(imp.wb.Sheets[name],{header:1,defval:"",blankrows:false});
 var F=FLD[imp.k],best=0,bi=0,lim=Math.min(imp.rows.length,20);
 for(var r=0;r<lim;r++){var c=0;imp.rows[r].forEach(function(x){var t=nrm(x);if(t&&F.some(function(f){return pat(f[0]).test(t)}))c++;if(t&&PRIM[imp.k].test(t))c+=5});if(c>best){best=c;bi=r}}
 imp.hdr=best?bi:-1;imp.map={};
 if(best)F.forEach(function(f){var h=imp.rows[bi],bc=-1,bn=-1;for(var c=0;c<h.length;c++){var t=nrm(h[c]);if(t&&pat(f[0]).test(t)){var n=nonEmpty(c,bi+1);if(n>bn){bn=n;bc=c}}}if(bc>=0)imp.map[f[0]]=bc});
 else F.forEach(function(f,i){imp.map[f[0]]=i});
 return best}
function pickXls(i,k){var f=i.files&&i.files[0];if(!f)return;
 if(!window.XLSX){iMsg="No se pudo cargar el lector de Excel";iBad=1;render();return}
 var rd=new FileReader();rd.onload=function(){try{var wb=XLSX.read(rd.result,{type:"array"});imp={k:k,wb:wb,name:f.name,mode:"add"};
  var bs=wb.SheetNames[0],bv=-1;wb.SheetNames.forEach(function(n){var v=loadSheet(n);if(v>bv){bv=v;bs=n}});loadSheet(bs);render()}
  catch(e){imp=null;iMsg="No se pudo leer el archivo";iBad=1;render()}};
 rd.readAsArrayBuffer(f)}
function parseNum(v){if(typeof v=="number")return v;var t=String(v).replace(/[^\d,.\-]/g,"");if(t.indexOf(",")>=0&&t.indexOf(".")<0)t=t.replace(",",".");else t=t.replace(/,/g,"");return parseFloat(t)||0}
function cell(r,f){var c=imp.map[f];if(c===undefined||c<0)return "";var v=r[c];if(v===undefined||v===null)return "";if(typeof v=="number"&&f=="tel")return String(Math.round(v));return typeof v=="string"?v.trim():v}
function impRows(){var out=[],k=imp.k;for(var i=imp.hdr+1;i<imp.rows.length;i++){var r=imp.rows[i],n=String(cell(r,"name")).trim();if(!n)continue;var o={name:n};
 if(k=="clientes"||k=="proveedores"){o.tel=String(cell(r,"tel")).trim();o.mail=String(cell(r,"mail")).trim();o.x=String(cell(r,"x")).trim()}
 else{o.cost=parseNum(cell(r,"cost"));o.price=parseNum(cell(r,"price"));if(k=="productos")o.stock=Math.round(parseNum(cell(r,"stock")))}
 out.push(o)}return out}
function setMap(f,v){imp.map[f]=+v;render()}
function setSheet(v){loadSheet(v);render()}
function setMode(v){imp.mode=v;render()}
function cancelImp(){imp=null;render()}
function vaciar(k){if(pend!="v:"+k){pend="v:"+k;render();return}pend=null;D[k]=[];save([k]);iMsg="Lista vaciada";iBad=0;render()}
function doImport(){var rows=impRows(),k=imp.k,kf=k=="clientes"?function(x){return nrm(x.name)+"|"+x.tel}:function(x){return nrm(x.name)},add=0;
 if(imp.mode=="replace")D[k]=[];
 var m={};D[k].forEach(function(x){m[kf(x)]=1});
 rows.forEach(function(x){if(!m[kf(x)]){D[k].push(x);m[kf(x)]=1;add++}});
 if(k=="clientes"||k=="proveedores")D[k].sort(function(a,b){return a.name.localeCompare(b.name,"es")});
 save([k]);iMsg="Importados "+add+" registros"+(rows.length-add?" ("+(rows.length-add)+" repetidos omitidos)":"");iBad=0;imp=null;render()}
function impCard(k){var h="";
 if(iMsg){h+='<div class="card '+(iBad?"b":"g")+'"><b>'+iMsg+'</b></div>';iMsg="";iBad=0}
 if(imp&&imp.k==k){var F=FLD[k],rows=impRows(),nc=0;imp.rows.slice(0,50).forEach(function(r){if(r.length>nc)nc=r.length});
  var lbl=function(c){var t=imp.hdr>=0?imp.rows[imp.hdr][c]:"";return XLSX.utils.encode_col(c)+(t!==""&&t!=null?": "+esc(String(t).slice(0,18)):"")};
  h+='<div class="card"><b>Importar desde Excel</b><small style="display:block;color:var(--mute);margin:2px 0 8px">Archivo: '+esc(imp.name)+'. Revisa que cada dato esté en la columna correcta.</small><form onsubmit="return false">';
  if(imp.wb.SheetNames.length>1)h+='<div class="w"><label>Hoja</label><select onchange="setSheet(this.value)">'+imp.wb.SheetNames.map(function(n){return '<option'+(n==imp.sheet?' selected':'')+'>'+esc(n)+'</option>'}).join("")+'</select></div>';
  F.forEach(function(f){var o='<option value="-1">— no importar —</option>';for(var c=0;c<nc;c++)o+='<option value="'+c+'"'+(imp.map[f[0]]===c?' selected':'')+'>'+lbl(c)+'</option>';h+='<div><label>'+f[1]+'</label><select onchange="setMap(\''+f[0]+'\',this.value)">'+o+'</select></div>'});
  h+='<div class="w"><label>Qué hacer con la lista actual</label><select onchange="setMode(this.value)"><option value="add"'+(imp.mode=="add"?' selected':'')+'>Añadir a la lista (sin repetir)</option><option value="replace"'+(imp.mode=="replace"?' selected':'')+'>Reemplazar toda la lista</option></select></div></form>';
  h+='<div style="margin:10px 0 4px"><b>Vista previa ('+rows.length+' registros)</b></div>';
  if(!rows.length)h+='<div class="empty">No se encontraron registros con esas columnas. Prueba otra hoja o cambia las columnas.</div>';
  rows.slice(0,3).forEach(function(x){h+='<div class="row"><span>'+esc(x.name)+'</span><small>'+(x.tel!==undefined?esc(x.tel):$(x.price))+'</small></div>'});
  h+='<div class="grid" style="margin-top:8px"><button class="p"'+(rows.length?'':' disabled style="opacity:.5"')+' onclick="doImport()">'+(imp.mode=="replace"?'Reemplazar e importar ':'Importar ')+rows.length+'</button><button class="p" style="background:var(--line);color:var(--ink)" onclick="cancelImp()">Cancelar</button></div></div>'}
 else h+='<div class="card"><div class="grid"><button class="p" onclick="document.getElementById(\'xf\').click()">Importar de Excel</button><button class="p" style="background:var(--line);color:var(--ink)" onclick="vaciar(\''+k+'\')">'+(pend=="v:"+k?'¿Vaciar la lista?':'Vaciar lista')+'</button></div><input id="xf" type="file" accept=".xlsx,.xls,.csv" hidden onchange="pickXls(this,\''+k+'\')"></div>';
 return h}
function eb(k,n){return k=="ventas"?"":'<button class="x" style="color:var(--acc);font-size:16px" aria-label="Editar" onclick="ed=\''+k+':'+n+'\';render()">✎</button>'}
function xb(k,n){return eb(k,n)+(pend==k+":"+n?'<button class="x" style="font-size:14px;font-weight:700" onclick="del(\''+k+'\','+n+')">¿Eliminar?</button>':'<button class="x" aria-label="Eliminar" onclick="del(\''+k+'\','+n+')">×</button>')}
function del(k,n){var key=k+":"+n;if(pend!=key){pend=key;render();return}pend=null;openV=null;
 if(k=="ventas"){var v=D.ventas[n];(v.lines||[]).forEach(function(l){D.productos.forEach(function(p){if(p.name==l.name&&p.stock!==undefined)p.stock+=l.q})})}
 var mk=k=="ventas"?mkey(D.ventas[n].d):0;D[k].splice(n,1);save(k=="ventas"?["ventas","productos"]:[k],mk);render()}
function err(t){msg=t;msgBad=1;render()}
function cotizar(){
 var opts="";[["productos","Producto"],["servicios","Servicio"]].forEach(function(g){
  D[g[0]].forEach(function(i,n){opts+='<option value="'+g[0]+':'+n+'">'+g[1]+': '+esc(i.name)+'</option>'})});
 var h='<div class="card">'+(opts?'<form onsubmit="addQ(event)"><div class="w"><label>Concepto</label><select name="it">'+opts+'</select></div>'+
 '<div class="w"><label>Cantidad</label><input name="q" type="number" min="0.1" step="0.1" value="1" required></div>'+
 '<button class="p w">Agregar a la cotización</button></form>':'<div class="empty">Primero registra productos o servicios.</div>')+'</div>';
 var t=0,c=0;h+='<div class="card">';
 if(!quote.length)h+='<div class="empty">La cotización está vacía.</div>';
 quote.forEach(function(l,n){var i=itm(l);if(!i)return;t+=i.price*l.q;c+=i.cost*l.q;
  h+='<div class="row"><div><b>'+esc(i.name)+'</b><small>'+l.q+' × '+$(i.price)+'</small></div><div class="r">'+$(i.price*l.q)+'</div><button class="x" aria-label="Quitar" onclick="quote.splice('+n+',1);render()">×</button></div>'});
 h+='<div class="row"><b>Total a cobrar</b><b>'+$(t)+'</b></div><div class="row"><span>Costo</span><span>'+$(c)+'</span></div><div class="row"><span>Ganancia</span><b class="g">'+$(t-c)+'</b></div>';
 if(quote.length)h+='<button class="p" style="width:100%;margin-top:8px" onclick="quote=[];render()">Vaciar cotización</button>';
 return h+'</div>'}
function addQ(e){e.preventDefault();var p=e.target.it.value.split(":");quote.push({k:p[0],n:+p[1],q:+e.target.q.value});render()}
nav();render();
</script>
